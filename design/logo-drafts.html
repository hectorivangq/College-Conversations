<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:F;src:url(../site/fonts/Fraunces-SemiBold.woff2)}@font-face{font-family:F;font-style:italic;src:url(../site/fonts/Fraunces-Italic-SemiBold.woff2)}@font-face{font-family:I;src:url(../site/fonts/Inter-SemiBold.woff2);font-weight:600}
body{margin:0;background:#F6F1E7;font-family:I;display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.c{padding:40px;display:grid;gap:24px;justify-items:start;border-right:1px solid #DCD2BF}.c.d{background:#0B1F3A}
.big{width:220px;height:220px}.row{display:flex;gap:18px;align-items:center}.s32{width:32px;height:32px}.s16{width:16px;height:16px}
.wm{display:flex;align-items:center;gap:14px}.wm svg{width:56px;height:56px}.t{display:grid;line-height:1.05}.n{font-family:F;font-size:27px;color:#0B1F3A;letter-spacing:-.01em}.n i{color:#8A5D12}.b{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#4A5A6E;margin-top:4px}
.d .n{color:#F6F1E7}.d .n i{color:#F5B335}.d .b{color:#B8C4D3}p{margin:0;font-size:13px;color:#4A5A6E}.d p{color:#B8C4D3}
</style></head><body>
<!-- A: cap on a speech bubble, CC arcs -->
<template id="A"><svg viewBox="0 0 64 64"><path d="M14 22h36a10 10 0 0 1 10 10v14a10 10 0 0 1-10 10H26l-10 7 1.5-7H14A10 10 0 0 1 4 46V32a10 10 0 0 1 10-10z" fill="#0B1F3A"/><path d="M32 3 59 13.5 32 24 5 13.5z" fill="#F5B335"/><path d="M59 13.5v11" stroke="#F5B335" stroke-width="2.4" stroke-linecap="round"/><circle cx="59" cy="27.5" r="3" fill="#F5B335"/><path d="M27.5 33.6a7 7 0 1 0 0 10.8M43.5 33.6a7 7 0 1 0 0 10.8" fill="none" stroke="#F6F1E7" stroke-width="4" stroke-linecap="round"/></svg></template>
<!-- B: badge; two C's as nested speech arcs + board -->
<template id="B"><svg viewBox="0 0 64 64"><rect x="2" y="2" width="60" height="60" rx="16" fill="#0B1F3A"/><path d="M32 11 53 19 32 27 11 19z" fill="#F5B335"/><path d="M53 19v9" stroke="#F5B335" stroke-width="2.2" stroke-linecap="round"/><circle cx="53" cy="30.5" r="2.6" fill="#F5B335"/><path d="M29 36.3a9 9 0 1 0 0 13.4" fill="none" stroke="#F6F1E7" stroke-width="4.2" stroke-linecap="round"/><path d="M44 36.3a9 9 0 1 0 0 13.4" fill="none" stroke="#F5B335" stroke-width="4.2" stroke-linecap="round"/></svg></template>
<!-- C: speech bubble badge, cap inside -->
<template id="C"><svg viewBox="0 0 64 64"><path d="M32 4C16.5 4 4 14.6 4 28c0 7.4 3.8 14 9.8 18.4L10 60l15-8.6c2.2.4 4.6.6 7 .6 15.5 0 28-10.6 28-24S47.5 4 32 4z" fill="#0B1F3A"/><path d="M32 16 50 23 32 30 14 23z" fill="#F5B335"/><path d="M22 27v8c0 3 4.5 5.5 10 5.5s10-2.5 10-5.5v-8" fill="none" stroke="#F5B335" stroke-width="3.2" stroke-linejoin="round"/><path d="M50 23v9" stroke="#F6F1E7" stroke-width="2.2" stroke-linecap="round"/><circle cx="50" cy="34.5" r="2.6" fill="#F6F1E7"/></svg></template>
<!-- D: two overlapping speech bubbles, front one wears the cap -->
<template id="D"><svg viewBox="0 0 64 64"><path d="M20 8h26a10 10 0 0 1 10 10v10a10 10 0 0 1-10 10h-1l1 7-8-7H20a10 10 0 0 1-10-10V18A10 10 0 0 1 20 8z" fill="#F5B335"/><path d="M14 22h24a10 10 0 0 1 10 10v12a10 10 0 0 1-10 10H22l-9 7 1.4-7.2A10 10 0 0 1 4 44V32a10 10 0 0 1 10-10z" fill="#0B1F3A" stroke="#F6F1E7" stroke-width="2.5"/><path d="M26 30 38 34.5 26 39 14 34.5z" fill="#F5B335"/><path d="M19 37.5v4.5c0 1.8 3.1 3.3 7 3.3s7-1.5 7-3.3v-4.5" fill="none" stroke="#F5B335" stroke-width="2.4"/></svg></template>
<script>
const t={A:'Cap on a conversation',B:'CC monogram badge',C:'Cap in a speech bubble',D:'Two bubbles, one graduate'};
for(const k of 'ABCD'){for(const dark of [0,1]){}}
for(const k of 'ABCD'){const s=document.getElementById(k).innerHTML;const c=document.createElement('div');c.className='c';c.innerHTML=`<p><b>${k}</b> · ${t[k]}</p><div class=big>${s}</div><div class=row><div class=s32>${s}</div><div class=s16>${s}</div></div><div class=wm>${s}<div class=t><span class=n>College <i>Conversations</i></span><span class=b>with Dr. Janice Fedor</span></div></div><div class="wm" style="background:#0B1F3A;padding:14px 16px;border-radius:12px">${s}<div class=t><span class=n style="color:#F6F1E7">College <i style="color:#F5B335">Conversations</i></span><span class=b style="color:#B8C4D3">with Dr. Janice Fedor</span></div></div>`;document.body.appendChild(c);}
document.querySelectorAll('.big svg,.s32 svg,.s16 svg,.wm svg').forEach(s=>{s.style.width='100%';s.style.height='100%'});
</script></body></html>
